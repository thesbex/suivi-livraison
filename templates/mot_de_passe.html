{% extends "base.html" %}
{% block titre %}Mot de passe — Suivi Livraison{% endblock %}
{% block contenu %}
<header class="entete anim">
  <div>
    <h1>Changer mon mot de passe</h1>
    <p class="sous-titre">Compte {{ session.nom }}</p>
  </div>
</header>
<div class="carte carte-etroite anim d1">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label class="champ">Mot de passe actuel<input type="password" name="actuel" required></label>
    <label class="champ">Nouveau mot de passe<input type="password" name="nouveau" required minlength="6"></label>
    <label class="champ">Confirmation<input type="password" name="confirmation" required minlength="6"></label>
    <button class="btn btn-plein">Enregistrer</button>
  </form>
</div>
{% endblock %}
